<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FloodRisk AI - AI-Based Flood Risk Prediction System</title>
    <meta name="description" content="AI-Based Flood Risk Prediction System predicting flood risk using environmental and weather parameters." />
    
    <!-- PWA Manifest & Mobile Capability -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#080c16" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" href="/vite.svg" />
    
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script type="module">
      // Registered in production builds only — Vite's dev server has no /sw.js file and falls back
      // to serving index.html for the request, which the browser then installs as a broken "service
      // worker" that intercepts and corrupts every subsequent module fetch in this dev session.
      if (!import.meta.env.DEV && 'serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then((registration) => {
            console.log('[PWA] ServiceWorker registered with scope:', registration.scope);
          }).catch((err) => {
            console.log('[PWA] ServiceWorker registration failed:', err);
          });
        });
      }
    </script>
  </body>
</html>
